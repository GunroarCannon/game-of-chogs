# Render blueprint: one free web service. Free instances have no disk and sleep after 15 idle minutes,
# so the world is mirrored to a free Upstash Redis and restored on wake. Secrets live in the dashboard.
services:
  - type: web
    name: game-of-chogs
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: CHAIN_MODE          # testnet (mock Genesis + faucet for judges) or mainnet (real Chog Genesis)
        value: testnet
      - key: PUBLIC_URL
        value: https://game-of-chogs.onrender.com
      - key: SESSION_SECRET
        generateValue: true
      - key: RELAYER_KEY         # pays gas for gasless mints and the daily seal
        sync: false
      - key: OPENSEA_API_KEY     # optional: resized Genesis art from OpenSea's CDN
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
