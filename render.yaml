# Render blueprint: two free web services from one repo.
#   game-of-chogs          mainnet: the real Chog Genesis, real holders
#   game-of-chogs-testnet  judge mirror: MockChogGenesis + free test-Chog faucet
# Free instances have no disk and sleep after 15 idle minutes, so each world is mirrored (gzipped) to Upstash
# Redis under its own key prefix and restored on wake. The same Upstash database can be shared with other
# projects: royal-ramble uses rb:, these use goc: and goct:. Secrets are set in the dashboard, never here.
services:
  - type: web
    name: game-of-chogs
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: CHAIN_MODE
        value: mainnet
      - key: STORE_PREFIX
        value: "goc:"
      - key: PUBLIC_URL
        value: https://game-of-chogs.onrender.com
      - key: SESSION_SECRET
        generateValue: true
      - key: RELAYER_KEY
        sync: false
      - key: OPENSEA_API_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

  - type: web
    name: game-of-chogs-testnet
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: CHAIN_MODE
        value: testnet
      - key: STORE_PREFIX
        value: "goct:"
      - key: PUBLIC_URL
        value: https://game-of-chogs-testnet.onrender.com
      - key: SESSION_SECRET
        generateValue: true
      - key: RELAYER_KEY
        sync: false
      - key: OPENSEA_API_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
